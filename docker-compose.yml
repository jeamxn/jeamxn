# Optional static-only container. GitHub Pages uses apps/web/build/client instead.
# Keep this root file path for an existing Dokploy installation; no API/DB/keys.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    expose: ['8080']
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
