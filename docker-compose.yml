# Dokploy reads THIS root file. Attach a domain to web:8080 in its Domains UI.
# No published host ports, domain labels, bind-mounted source, or legacy database.
x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  web:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      server:
        condition: service_healthy
    expose: ['8080']
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101,mode=1777
    networks: [edge]

  server:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    depends_on:
      valkey:
        condition: service_healthy
    expose: ['3000']
    mem_limit: 512m
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Runtime only. Set the real HTTPS origin in Dokploy, no trailing path.
      JEAMXN_PUBLIC_ORIGIN: ${JEAMXN_PUBLIC_ORIGIN:-http://127.0.0.1:5412}
      VALKEY_URL: redis://valkey:6379/0
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_REQUIRE_VALKEY: 'true'
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      AI_PEER_LIMIT: ${AI_PEER_LIMIT:-12}
      AI_GLOBAL_LIMIT: ${AI_GLOBAL_LIMIT:-100}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-300}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
      RESUME_FONT_PATH: /app/asset/fonts/NanumGothic-Regular.ttf
    networks: [edge, data]

  valkey:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
      target: valkey
    user: valkey
    command: ['valkey-server', '/usr/local/etc/valkey/valkey.conf']
    volumes:
      - valkey-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 192m
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks: [data]

networks:
  # Server needs outbound HTTPS only when AI is explicitly enabled.
  edge: {}
  data:
    internal: true

volumes:
  valkey-data: {}
