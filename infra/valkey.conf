bind 0.0.0.0
# Isolated internal Docker network, no published port; not a public database.
protected-mode no
port 6379
dir /data
logfile ""
loglevel notice
maxmemory 96mb
# Quota keys must not be silently evicted under pressure: fail closed instead.
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save ""
