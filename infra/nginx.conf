worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Re-resolve Compose DNS after server container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Do not log request paths, query strings, bodies, or forwarded credentials.
    log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location = /api { return 404; }
        location ^~ /api/ {
            set $api_upstream server:3000;
            proxy_pass http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Overwrite, never trust visitor-supplied forwarding identity.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
            proxy_buffering off;
            add_header Cache-Control 'no-store' always;
            include /etc/nginx/security-headers.conf;
        }
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable' always;
            include /etc/nginx/security-headers.conf;
        }
        # RR static prerender serves route/index.html before the SPA fallback.
        # Explicit file extensions never fall through to HTML (no false assets).
        location ~ /[^/]+\.[^/]+$ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=3600' always;
            include /etc/nginx/security-headers.conf;
        }
        location / {
            try_files $uri $uri/index.html /__spa-fallback.html /index.html;
            add_header Cache-Control 'no-cache' always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
